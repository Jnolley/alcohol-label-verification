<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-4xl mx-auto px-4">
    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">TTB Label Verification</h1>
      <p class="mt-2 text-gray-600">Upload a label image and enter product information to verify compliance</p>
    </header>

    <!-- Form and Upload Section -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <!-- Error Banner -->
      @if (store.error()) {
        <div class="error-banner">
          <div class="flex items-start gap-3">
            <svg class="w-6 h-6 text-error flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div class="flex-1">
              <p class="text-error font-medium">{{ store.error() }}</p>
            </div>
            <button
              type="button"
              (click)="onReset()"
              class="btn-reset text-sm"
            >
              Reset
            </button>
          </div>
        </div>
      }

      <h2 class="text-xl font-semibold text-gray-900 mb-6">Product Information</h2>

      <app-label-form
        (formSubmit)="onFormDataChange($event)"
        [verificationResult]="store.verificationResult()"
      />

      <div class="mt-8">
        <app-image-upload
          (filesSelected)="onImagesSelected($event)"
        />
      </div>

      <!-- Submit Button -->
      <div class="mt-8 flex gap-3">
        <button
          type="button"
          (click)="onSubmit()"
          [disabled]="!store.canSubmit() || store.isSubmitting()"
          class="btn-primary"
          data-cy="submit-button"
        >
          @if (store.isSubmitting()) {
            <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Verifying...</span>
          } @else {
            Verify Label
          }
        </button>

        @if (store.verificationResult() || store.error()) {
          <button
            type="button"
            (click)="onReset()"
            class="btn-secondary"
            data-cy="reset-button"
          >
            Reset
          </button>
        }
      </div>
    </div>

    <!-- Verification Results Modal -->
    @if (showModal && store.verificationResult()) {
      <app-verification-modal
        [result]="store.verificationResult()!"
        (close)="onCloseModal()"
      />
    }
  </div>
</div>

<div class="space-y-4" data-cy="image-upload">
  <div>
    <label class="block text-sm font-medium text-gray-900 mb-1.5">
      Label Image <span class="text-error">*</span>
    </label>
    <p class="text-sm text-gray-600 mb-3">
      Upload a clear image of the alcohol label (JPEG, PNG, or WebP, max 10MB)
    </p>

    <input
      #fileInput
      type="file"
      accept="image/jpeg,image/png,image/jpg,image/webp"
      (change)="onFileSelected($event)"
      class="hidden"
      id="file-upload"
      data-cy="file-input"
    />

    @if (!selectedFile()) {
      <label
        for="file-upload"
        class="block w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded text-center cursor-pointer hover:border-primary focus-within:outline-none focus-within:ring-2 focus-within:ring-primary"
      >
        <div class="space-y-1">
          <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="text-sm text-gray-600">
            <span class="font-medium text-primary">Click to upload</span> or drag and drop
          </div>
          <p class="text-xs text-gray-500">PNG, JPG, WebP up to 10MB</p>
        </div>
      </label>
    }

    @if (selectedFile()) {
      <div class="border border-gray-300 rounded p-4">
        <!-- Preview -->
        @if (previewUrl()) {
          <div class="mb-3">
            <img
              [src]="previewUrl()"
              [alt]="selectedFile()!.name"
              class="max-w-full h-auto max-h-64 mx-auto border border-gray-200 rounded"
              data-cy="image-preview"
            />
          </div>
        }

        <!-- File Info -->
        <div class="flex items-center justify-between">
          <div class="text-sm">
            <p class="font-medium text-gray-900">{{ selectedFile()!.name }}</p>
            <p class="text-gray-500">{{ formatFileSize(selectedFile()!.size) }}</p>
          </div>
          <button
            type="button"
            (click)="clearSelection(); fileInput.value = ''"
            class="px-3 py-1.5 text-sm text-error border border-error rounded hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-error"
            data-cy="remove-image-button"
          >
            Remove
          </button>
        </div>
      </div>
    }

    @if (error()) {
      <p class="mt-2 text-sm text-error" data-cy="upload-error">{{ error() }}</p>
    }
  </div>
</div>

<div
  class="space-y-4"
  data-cy="image-upload"
  (dragover)="$event.preventDefault()"
  (drop)="$event.preventDefault()"
>
  <div>
    <label class="block text-sm font-medium text-gray-900 mb-1.5">
      Label Images <span class="text-error">*</span>
    </label>
    <p class="text-sm text-gray-600 mb-3">
      Upload 1-2 clear images of the label (JPEG, PNG, or WebP, max 10MB each)
    </p>

    <input
      #fileInput
      type="file"
      accept="image/jpeg,image/png,image/jpg,image/webp"
      (change)="onFileSelected($event)"
      multiple
      class="hidden"
      id="file-upload"
      data-cy="file-input"
    />

    <!-- Upload Zone - Show if less than 2 images -->
    @if (images().length < 2) {
      <label
        for="file-upload"
        (dragenter)="onDragOver($event)"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class]="isDragging() ? 'upload-zone upload-zone-dragging' : 'upload-zone upload-zone-default'"
      >
        <div class="space-y-1">
          <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="text-sm text-gray-600">
            <span class="font-medium text-primary">Click to upload</span> or drag and drop
          </div>
          <p class="text-xs text-gray-500">
            @if (images().length === 0) {
              Upload 1-2 images • PNG, JPG, WebP up to 10MB
            } @else {
              Add 1 more image • PNG, JPG, WebP up to 10MB
            }
          </p>
        </div>
      </label>
    }

    <!-- Uploaded Images Grid -->
    @if (images().length > 0) {
      <div class="grid grid-cols-1 gap-4 mt-4" [class.md:grid-cols-2]="images().length === 2">
        @for (image of images(); track $index) {
          <div class="image-preview-card">
            <!-- Preview -->
            <div class="mb-3">
              <img
                [src]="image.preview"
                [alt]="image.file.name"
                class="image-preview-img"
                [attr.data-cy]="'image-preview-' + $index"
              />
            </div>

            <!-- File Info -->
            <div class="flex items-center justify-between">
              <div class="text-sm flex-1 min-w-0 mr-2">
                <p class="font-medium text-gray-900 truncate">{{ image.file.name }}</p>
                <p class="text-gray-500">{{ formatFileSize(image.file.size) }}</p>
              </div>
              <button
                type="button"
                (click)="removeImage($index)"
                class="btn-remove"
                [attr.data-cy]="'remove-image-button-' + $index"
              >
                Remove
              </button>
            </div>
          </div>
        }
      </div>
    }

    @if (error()) {
      <p class="mt-2 text-sm text-error" data-cy="upload-error">{{ error() }}</p>
    }
  </div>
</div>

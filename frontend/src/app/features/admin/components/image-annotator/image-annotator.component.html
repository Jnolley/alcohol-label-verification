<div class="space-y-3">
  <!-- Controls -->
  <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <!-- Toggle Button -->
      <button
        (click)="toggleAnnotations()"
        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200 shadow-sm"
        [ngClass]="showAnnotations()
          ? 'bg-blue-600 text-white hover:bg-blue-700 hover:shadow-md'
          : 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 hover:border-gray-400'"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          @if (showAnnotations()) {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          } @else {
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          }
        </svg>
        {{ showAnnotations() ? 'Hide Annotations' : 'Show Annotations' }}
      </button>

      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
        <!-- Color Legend -->
        <div class="flex items-center gap-3 text-xs">
          <div class="flex items-center gap-1.5 px-2 py-1 bg-green-50 rounded-md border border-green-200">
            <div class="w-3 h-3 border-2 rounded-sm" style="border-color: #10b981;"></div>
            <span class="text-green-800 font-medium">Match</span>
          </div>
          <div class="flex items-center gap-1.5 px-2 py-1 bg-red-50 rounded-md border border-red-200">
            <div class="w-3 h-3 border-2 rounded-sm" style="border-color: #ef4444;"></div>
            <span class="text-red-800 font-medium">Error</span>
          </div>
          <div class="flex items-center gap-1.5 px-2 py-1 bg-cyan-50 rounded-md border border-cyan-200">
            <div class="w-3 h-3 border-2 rounded-sm" style="border-color: #06b6d4;"></div>
            <span class="text-cyan-800 font-medium">Other</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Canvas Container -->
  <div class="relative bg-gradient-to-br from-gray-50 to-gray-100 rounded-lg p-6 border border-gray-200">
    <!-- Loading Overlay -->
    @if (loading()) {
      <div class="absolute inset-0 flex items-center justify-center bg-gray-50/90 rounded-lg z-10">
        <div class="text-center">
          <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-3"></div>
          <p class="text-gray-500 text-sm font-medium">Loading image...</p>
        </div>
      </div>
    }

    <canvas
      #canvas
      (mousemove)="onMouseMove($event)"
      (mouseleave)="onMouseLeave()"
      class="max-w-full max-h-[600px] h-auto border-2 border-gray-300 rounded-lg shadow-lg bg-white mx-auto block hover:border-gray-400 transition-colors"
    ></canvas>

    <!-- Tooltip -->
    @if (tooltip()) {
      <div
        class="fixed z-50 bg-gray-900 text-white text-xs rounded-lg shadow-2xl px-3 py-2.5 pointer-events-none max-w-xs border border-gray-700"
        [style.left.px]="tooltip()!.x + 15"
        [style.top.px]="tooltip()!.y + 15"
      >
        <div class="font-semibold text-sm mb-1.5 text-white">{{ tooltip()!.text }}</div>
        <div class="text-gray-300 space-y-1 text-xs">
          <div class="flex items-center gap-1.5">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Confidence: {{ tooltip()!.confidence.toFixed(1) }}%
          </div>
          @if (tooltip()!.fieldType) {
            <div class="flex items-center gap-1.5 text-blue-300 font-medium">
              <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
              </svg>
              {{ tooltip()!.fieldType }}
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>

<div class="space-y-4">
  @if (loading()) {
    <!-- Loading State -->
    <div class="flex items-center justify-center min-h-[300px]">
      <div class="text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto mb-4"></div>
        <p class="text-gray-600">Loading image...</p>
      </div>
    </div>
  } @else {
    <!-- Controls -->
    <div class="flex items-center justify-between">
      <button
        (click)="toggleAnnotations()"
        class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-700 transition-colors"
      >
        {{ showAnnotations() ? 'Hide Annotations' : 'Show Annotations' }}
      </button>

      <div class="flex items-center gap-6">
        <!-- Hover Hint -->
        <div class="flex items-center gap-2 text-sm text-gray-600">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="italic">Hover over annotations to view details</span>
        </div>

        <!-- Color Legend -->
        <div class="flex items-center gap-4 text-sm">
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 border-2 rounded" style="border-color: #10b981;"></div>
            <span>Match</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 border-2 rounded" style="border-color: #ef4444;"></div>
            <span>Mismatch</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-4 h-4 border-2 rounded" style="border-color: #06b6d4;"></div>
            <span>Other Text</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Canvas Container -->
    <div class="relative bg-gray-50 rounded-lg p-4 inline-block">
      <canvas
        #canvas
        (mousemove)="onMouseMove($event)"
        (mouseleave)="onMouseLeave()"
        class="max-w-full h-auto shadow-lg"
      ></canvas>

      <!-- Tooltip -->
      @if (tooltip()) {
        <div
          class="fixed z-50 bg-gray-900 text-white text-sm rounded-lg shadow-lg px-3 py-2 pointer-events-none"
          [style.left.px]="tooltip()!.x + 10"
          [style.top.px]="tooltip()!.y + 10"
        >
          <div class="font-semibold">{{ tooltip()!.text }}</div>
          <div class="text-gray-300">Confidence: {{ tooltip()!.confidence.toFixed(1) }}%</div>
          @if (tooltip()!.fieldType) {
            <div class="text-gray-300">Field: {{ tooltip()!.fieldType }}</div>
          }
        </div>
      }
    </div>
  }
</div>
